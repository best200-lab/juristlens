# render.yaml
# Render deployment configuration for JuristLens
# Uses Docker for full Python version control

services:
  - type: web
    name: juristmind-juristlens
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false           # Set manually in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
    healthCheckPath: /api/health
    autoDeploy: true          # Auto deploy on every GitHub push
