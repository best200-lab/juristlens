services:
  - type: web
    name: juristmind-juristlens
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9   # ✅ ADD THIS LINE (CRITICAL)

      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6

    healthCheckPath: /api/health
    autoDeploy: true
